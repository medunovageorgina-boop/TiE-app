<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiE — Your stories. Your rules.</title>
  <style>
    /* СТРОГИЕ ЦВЕТА И СТИЛИ TIE */
    :root {
      --bg-main: #0b0d12;
      --bg-card: #141824;
      --bg-input: #1b2030;
      --text-main: #f0f2f5;
      --text-muted: #8c96a8;
      --accent-navy: #1a2942;
      --accent-beige: #d4b896;
      --border: #283248;
      --danger: #9e3232;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    .app { width: 100%; max-width: 480px; background: #0e111a; display: flex; flex-direction: column; height: 100vh; position: relative; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

    /* ШАПКА */
    header { height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--bg-card); }
    .avatar-btn { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--accent-beige); background: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 2px; }
    .avatar-btn svg { width: 100%; height: 100%; }
    .logo { font-size: 24px; font-weight: 900; letter-spacing: 2px; color: var(--text-main); }
    .logo span { color: var(--accent-beige); }

    /* ОСНОВНОЙ КОНТЕНТ */
    main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .page { display: none; flex-direction: column; gap: 16px; }
    .page.active { display: flex; }

    /* КАРТОЧКИ И КНОПКИ ГЛАВНОГО МЕНЮ ПО РИСУНКУ */
    .btn-main { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 16px; border-radius: 8px; font-size: 16px; font-weight: 600; text-align: left; cursor: pointer; transition: 0.2s; }
    .btn-main:active { background: var(--bg-input); }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-tie-new { background: var(--accent-navy); border: 1px solid var(--accent-beige); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 8px; }
    .tie-icon { width: 32px; height: 40px; fill: var(--accent-beige); }

    /* НИЖНЯЯ ПАНЕЛЬ С КРУПНОЙ КНОПКОЙ ВЫКЛЮЧЕНИЯ ПО ЦЕНТРУ */
    nav { height: 70px; background: var(--bg-card); border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; padding: 8px 12px; align-items: center; }
    .nav-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); height: 44px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .nav-btn.power { background: var(--accent-navy); border-color: var(--accent-beige); height: 52px; font-size: 14px; color: var(--accent-beige); }

    /* МОДАЛЬНЫЕ ОКНА И ПАРАМЕТРЫ */
    .modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 100; padding: 20px; flex-direction: column; justify-content: center; }
    .modal.active { display: flex; }
    .modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    input, textarea, select { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; font-size: 14px; }
    label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }

    /* БАББЛЫ ЧАТА */
    .chat-box { flex: 1; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; margin-bottom: 12px; }
    .msg { max-width: 85%; padding: 12px; border-radius: 6px; font-size: 14px; line-height: 1.4; position: relative; }
    .msg.user { background: var(--accent-navy); align-self: flex-end; border: 1px solid var(--border); }
    .msg.bot { background: var(--bg-card); align-self: flex-start; border: 1px solid var(--border); }
    .msg-edit-count { font-size: 10px; color: var(--accent-beige); margin-top: 4px; text-align: right; }
    
    .chat-header { padding: 12px; background: var(--bg-card); border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

<div class="app">
  <!-- ШАПКА -->
  <header>
    <div class="avatar-btn" onclick="openPage('profile')">
      <!-- ЛОГОТИП КАТА В ГАЛСТУКЕ По ТВОЕМУ РИСУНКУ -->
      <svg viewBox="0 0 100 100">
        <path d="M20 20 L35 35 L30 65 L45 55 L55 55 L70 65 L65 35 L80 20 L65 25 L50 15 L35 25 Z" fill="#000" stroke="#fff" stroke-width="2"/>
        <polygon points="45,45 55,45 58,75 50,85 42,75" fill="#fff" />
      </svg>
    </div>
    <div class="logo">Ti<span>E</span></div>
    <div style="width:42px;"></div>
  </header>

  <!-- ОСНОВНЫЕ СТРАНИЦЫ -->
  <main>
    <!-- 1. ГЛАВНАЯ СТРАНИЦА -->
    <div id="p-home" class="page active">
      <button class="btn-main" onclick="openPage('history')">
        📋 ИСТОРИЯ <br><small style="color:var(--text-muted)">Все ваши RP</small>
      </button>

      <div class="grid-2">
        <button class="btn-main btn-tie-new" onclick="openPage('new-rp')">
          <svg class="tie-icon" viewBox="0 0 24 32"><path d="M6 2 L18 2 L20 10 L14 26 L12 30 L10 26 L4 10 Z"/><circle cx="12" cy="12" r="4" fill="var(--accent-navy)"/><path d="M12 10 V14 M10 12 H14" stroke="var(--accent-beige)" stroke-width="2"/></svg>
          НОВЫЙ RP
        </button>
        <button class="btn-main" onclick="openPage('settings')">
          ⚙️ НАСТРОЙКИ
        </button>
      </div>

      <button class="btn-main" onclick="openPage('bots')" style="padding: 24px; text-align: center;">
        🤖 БОТЫ ДЛЯ RP
      </button>
    </div>

    <!-- 2. ИСТОРИЯ (ПО ДАТАМ) -->
    <div id="p-history" class="page">
      <h3>История RP</h3>
      <div id="history-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      <button class="btn-main" onclick="openPage('home')">← Назад</button>
    </div>

    <!-- 3. НОВЫЙ RP -->
    <div id="p-new-rp" class="page">
      <h3>Создать новый RP</h3>
      <label>Тип:</label>
      <select id="rp-type"><option>История</option><option>Персонаж</option></select>
      <label>Название истории / персонажа:</label>
      <input type="text" id="rp-name" placeholder="Например: Потерянная расчёска">
      <label>Описание / Сюжет / Рост / Особенности:</label>
      <textarea id="rp-desc" rows="4" placeholder="Рост: 160см, красноволосая, встретились в библиотеке..."></textarea>
      
      <label><input type="checkbox" id="rp-net"> Брать информацию из интернета (для фильмов/книг)</label>
      <label><input type="checkbox" id="rp-pub"> Опубликовать в БОТЫ для всех</label>
      
      <button class="btn-main" style="background:var(--accent-navy)" onclick="createRP()">Начать историй (Новый галстук)</button>
      <button class="btn-main" onclick="openPage('home')">Отмена</button>
    </div>

    <!-- 4. ЧАТ С РЕАЛЬНЫМ ПОЛЕМ И ИЗМЕНЕНИЕМ ПАРАМЕТРОВ -->
    <div id="p-chat" class="page">
      <div class="chat-header" onclick="openParams()">
        <div>
          <strong id="chat-title">Потерянная расчёска</strong><br>
          <small style="color:var(--accent-beige)">Нажмите, чтобы изменить параметры</small>
        </div>
        <span>✏️</span>
      </div>
      <div class="chat-box" id="chat-messages"></div>
      
      <div style="display:flex; gap:8px;">
        <input type="text" id="chat-input" placeholder="Напишите сообщение...">
        <button class="btn-main" style="width:80px;" onclick="sendMsg()">Отправить</button>
      </div>
      <button class="btn-main" onclick="openPage('history')" style="margin-top:8px;">← Назад к историям</button>
    </div>

    <!-- 5. НАСТРОЙКИ -->
    <div id="p-settings" class="page">
      <h3>Строгие настройки TiE</h3>
      <label><input type="checkbox" id="fatigue-toggle" onchange="toggleFatigue()"> Защита от усталости (по умолчанию выкл)</label>
      <small style="color:var(--text-muted)">Делать паузу 10 мин каждые 150 сообщений</small>
      <hr style="border-color:var(--border)">
      <label>Ваш пароль безопасности:</label>
      <input type="password" id="pin-input" value="0000">
      <button class="btn-main" onclick="alert('Настройки сохранены!')">Сохранить</button>
      <button class="btn-main" onclick="openPage('home')">← Назад</button>
    </div>

    <!-- 6. КОРЗИНА НА 86 ЧАСОВ -->
    <div id="p-trash" class="page">
      <h3>Корзина (Хранение 86 часов)</h3>
      <div id="trash-list"></div>
      <button class="btn-main" onclick="openPage('home')">← Назад</button>
    </div>
  </main>

  <!-- НИЖНЯЯ ПАНЕЛЬ -->
  <nav>
    <button class="nav-btn" onclick="toggleLang()">LA (<span id="lang-name">RU</span>)</button>
    <button class="nav-btn power" onclick="lockApp()">ВЫКЛЮЧИТЬ</button>
    <button class="nav-btn" onclick="openPage('trash')">КОРЗИНА</button>
  </nav>

  <!-- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ ПАРАМЕТРОВ -->
  <div class="modal" id="modal-params">
    <div class="modal-box">
      <h3>Параметры RP</h3>
      <label>Сюжет и Описание персонажа (например, изменить рост с 160 на 180):</label>
      <textarea id="edit-params-text" rows="5"></textarea>
      <button class="btn-main" style="background:var(--accent-navy)" onclick="saveParams()">Сохранить изменения</button>
      <button class="btn-main" onclick="closeParams()">Отмена</button>
    </div>
  </div>

  <!-- ОКНО ЭКРАНА БЛОКИРОВКИ -->
  <div class="modal" id="modal-lock">
    <div class="modal-box" style="text-align:center;">
      <h3>TiE Заблокирован</h3>
      <p style="font-size:12px; color:var(--text-muted)">Введите ваш пароль для входа</p>
      <input type="password" id="lock-pin" placeholder="0000">
      <button class="btn-main" style="background:var(--accent-navy)" onclick="unlockApp()">Разблокировать</button>
    </div>
  </div>
</div>

<script>
  // СОСТОЯНИЕ ПРИЛОЖЕНИЯ
  let currentRP = null;
  let rps = JSON.parse(localStorage.getItem('tie_rps') || '[]');
  let trash = JSON.parse(localStorage.getItem('tie_trash') || '[]');

  function openPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('p-' + id).classList.add('active');
    if(id === 'history') renderHistory();
    if(id === 'trash') renderTrash();
  }

  function createRP() {
    const name = document.getElementById('rp-name').value || 'Новая история';
    const desc = document.getElementById('rp-desc').value || '';
    const date = new Date().toLocaleDateString('ru-RU');
    
    const newObj = { id: Date.now(), name, desc, date, msgs: [] };
    rps.push(newObj);
    localStorage.setItem('tie_rps', JSON.stringify(rps));
    
    startChat(newObj.id);
  }

  function renderHistory() {
    const box = document.getElementById('history-list');
    box.innerHTML = rps.length === 0 ? '<p style="color:var(--text-muted)">Историй пока нет.</p>' : '';
    rps.forEach(item => {
      box.innerHTML += `
        <div class="btn-main" style="display:flex; justify-content:space-between; align-items:center;">
          <div onclick="startChat(${item.id})">
            <strong>${item.name}</strong><br>
            <small style="color:var(--text-muted)">${item.date}</small>
          </div>
          <button onclick="deleteRP(${item.id})" style="background:var(--danger); border:none; color:#fff; padding:6px 10px; border-radius:4px;">🗑</button>
        </div>`;
    });
  }

  function startChat(id) {
    currentRP = rps.find(x => x.id === id);
    document.getElementById('chat-title').innerText = currentRP.name;
    renderMsgs();
    openPage('chat');
  }

  function renderMsgs() {
    const box = document.getElementById('chat-messages');
    box.innerHTML = currentRP.msgs.length === 0 ? '<div class="msg bot">Привет! Давай начнём нашу RP историю без ограничений.</div>' : '';
    currentRP.msgs.forEach((m, idx) => {
      box.innerHTML += `
        <div class="msg ${m.role}">
          ${m.text}
          ${m.role === 'bot' ? `<div class="msg-edit-count">Правка: ${m.edits || 0}/9</div>` : ''}
        </div>`;
    });
  }

  function sendMsg() {
    const inp = document.getElementById('chat-input');
    if(!inp.value.trim()) return;
    
    currentRP.msgs.push({ role: 'user', text: inp.value });
    // Авто-ответ бота без цензуры
    currentRP.msgs.push({ role: 'bot', text: 'Понял тебя. Продолжаем отыгрыш по твоим правилам.', edits: 0 });
    
    inp.value = '';
    localStorage.setItem('tie_rps', JSON.stringify(rps));
    renderMsgs();
  }

  // РЕДАКТИРОВАНИЕ ПАРАМЕТРОВ (РОСТ 160 -> 180 СМ)
  function openParams() {
    document.getElementById('edit-params-text').value = currentRP.desc;
    document.getElementById('modal-params').classList.add('active');
  }
  function closeParams() { document.getElementById('modal-params').classList.remove('active'); }
  function saveParams() {
    currentRP.desc = document.getElementById('edit-params-text').value;
    localStorage.setItem('tie_rps', JSON.stringify(rps));
    closeParams();
    alert('Параметры истории успешно обновлены!');
  }

  // КОРЗИНА 86 ЧАСОВ
  function deleteRP(id) {
    const item = rps.find(x => x.id === id);
    trash.push({ ...item, deletedAt: Date.now() });
    rps = rps.filter(x => x.id !== id);
    localStorage.setItem('tie_rps', JSON.stringify(rps));
    localStorage.setItem('tie_trash', JSON.stringify(trash));
    renderHistory();
  }
  function renderTrash() {
    const box = document.getElementById('trash-list');
    box.innerHTML = trash.length === 0 ? '<p style="color:var(--text-muted)">Корзина пуста.</p>' : '';
    const now = Date.now();
    trash.forEach(item => {
      const hoursLeft = Math.max(0, 86 - Math.floor((now - item.deletedAt) / (1000 * 60 * 60)));
      box.innerHTML += `
        <div class="btn-main">
          <strong>${item.name}</strong> (Удалится через ${hoursLeft} ч)
        </div>`;
    });
  }

  // БЛОКИРОВКА И ПАРОЛЬ
  function lockApp() { document.getElementById('modal-lock').classList.add('active'); }
  function unlockApp() {
    const pin = document.getElementById('pin-input').value;
    if(document.getElementById('lock-pin').value === pin) {
      document.getElementById('modal-lock').classList.remove('active');
    } else { alert('Неверный пароль!'); }
  }

  // СМЕНА ЯЗЫКА (НАЗВАНИЕ TIE НЕ МЕНЯЕТСЯ)
  const langs = ['RU', 'EN', 'UK', 'DE', 'ZH'];
  let lIdx = 0;
  function toggleLang() {
    lIdx = (lIdx + 1) % langs.length;
    document.getElementById('lang-name').innerText = langs[lIdx];
  }
</script>
</body>
</html>
